{{- /* {{< swatches "#64748b" "#3b82f6" "#06b6d4" >}} — a row of colour chips, each labelled with the value passed. */ -}}
{{- if eq (len .Params) 0 }}{{ errorf "swatches shortcode: pass one or more colours, e.g. {{</* swatches \"#fff\" \"#000\" */>}} (%s)" .Position }}{{ end -}}
<div class="swatches">
  {{- range .Params }}
  <div class="swatches__item">
    <span class="swatches__chip" style="background:{{ . }}"></span>
    <span class="swatches__label">{{ . }}</span>
  </div>
  {{- end }}
</div>
