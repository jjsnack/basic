{{ define "main" }}
  <header class="page-head">
    <h1>{{ site.Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>
    {{ else }}{{ with site.Params.description }}<p class="page-intro">{{ . }}</p>{{ end }}{{ end }}
  </header>
  {{ partial "topics.html" . }}
  {{ partial "post-list.html" (where site.RegularPages "Type" "posts") }}
{{ end }}
