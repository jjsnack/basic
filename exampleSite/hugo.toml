baseURL = "https://example.org/"
locale = "en"
title = "basic"
theme = "basic"
themesDir = "../.."

[pagination]
  pagerSize = 6

[params]
  description = "A minimal theme for text-first blogs."
  footerNote = "Built with the basic theme."

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 2
[[menu.main]]
  name = "Now"
  url = "/now/"
  weight = 3

[taxonomies]
  topic = "topics"

[markup.goldmark.renderer]
  unsafe = true

# Syntax highlighting via CSS classes so the theme (main.css) colours tokens.
[markup.highlight]
  noClasses = false

# LaTeX math: $...$ / \(...\) inline, $$...$$ / \[...\] block
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]
